<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="m3u_tv">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>m3u_tv</title>
  <link rel="manifest" href="manifest.json">

  <!-- Lets mkv_player.mjs and the @mediabunny/* audio extensions it loads
       share one Mediabunny instance (the extensions import "mediabunny" by
       its bare name). Resolved against <base>, like the files themselves.
       The AC-3 and AAC ones get it through mediabunny_coders.mjs, which also
       records their coders for live_audio_filter.mjs. -->
  <script type="importmap">
    {
      "imports": { "mediabunny": "./js/mediabunny.min.mjs" },
      "scopes": {
        "./js/mediabunny-ac3.min.mjs": { "mediabunny": "./mediabunny_coders.mjs" },
        "./js/mediabunny-aac-encoder.min.mjs": { "mediabunny": "./mediabunny_coders.mjs" }
      }
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
