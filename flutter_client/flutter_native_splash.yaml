flutter_native_splash:
  # Dark background matching the app's surface colour
  color: "#0a0a0f"
  image: assets/icons/splash-icon.png

  # Dark-mode (same assets — the background is already dark)
  color_dark: "#0a0a0f"
  image_dark: assets/icons/splash-icon.png

  # Android 12+ splash API — icon is shown inside a circle
  android_12:
    color: "#0a0a0f"
    image: assets/icons/splash-icon.png
    icon_background_color: "#0a0a0f"
    color_dark: "#0a0a0f"
    image_dark: assets/icons/splash-icon.png

  # windowDrawsSystemBarBackgrounds is tied directly to this flag by the
  # flutter_native_splash package (android.dart) - it hardcodes that value to
  # whatever `fullscreen` is set to. The app relies on it being true for its
  # transparent/edge-to-edge system bars, independent of the splash screen
  # itself, so this must be explicit or every regeneration silently reverts it.
  fullscreen: true

  ios: true
  android: true
  web: false
