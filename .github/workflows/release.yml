name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string
      desktop_artifacts_only:
        description: 'Build Linux and Windows workflow artifacts without publishing a release'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Gate: analyze, test, resolve version/prev-tag ─────────────────────────
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      prev_tag: ${{ steps.version.outputs.prev_tag }}
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          BUILD_NUMBER="${{ github.run_number }}"
          PREV_TAG=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${TAG}$" \
            | head -1 || echo "")
          echo "version=$VERSION"           >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "prev_tag=$PREV_TAG"         >> $GITHUB_OUTPUT
          echo "Building v$VERSION (build $BUILD_NUMBER) - prev: ${PREV_TAG:-none}"

      - name: Install native-asset build deps
        # `flutter test` builds native assets for the host (Linux here), and
        # window_manager's cnativeapi hook needs GTK 3, X11 and Xi headers.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Same scan as ci.yml, run again at release time: a vulnerability can be
      # published after the last CI run, and it must stop the release.
      - name: Scan dependencies
        uses: ./.github/actions/security-scan

  # ── Android phone + Android TV (single APK, leanback optional) ────────────
  build-android:
    name: Build Android APK
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.desktop_artifacts_only != true }}
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Set up Android NDK
        uses: ./.github/actions/android-ndk

      - name: Get dependencies
        run: flutter pub get

      - name: Decode Firebase config
        # google-services.json is gitignored (not published), so CI checkouts
        # need it written from a repo secret before the build - otherwise
        # Firebase.initializeApp() fails in release builds built from source.
        # Must run before any gradlew invocation: the Google Services Gradle
        # plugin's processDebugGoogleServices task now runs as a dependency of
        # testDebugUnitTest (not just assembleRelease), so it needs this file
        # in place before "Test native Android code" below.
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is missing or empty."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Test native Android code
        run: ./android/gradlew -p android :app:testDebugUnitTest

      - name: Set version
        run: |
          sed -i "s/^version: .*/version: ${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}/" pubspec.yaml

      - name: Validate and decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: Required Android signing secret $name is missing or empty."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > upload-keystore.jks
          test -s upload-keystore.jks

      - name: Build APK
        # M3UTV_SIDELOAD_UPDATER turns on the in-app updater and adds
        # REQUEST_INSTALL_PACKAGES. GitHub/Downloader APK only - the Play
        # bundle must be built without it (Play forbids self-updating).
        run: |
          flutter build apk --release --dart-define=M3UTV_SIDELOAD_UPDATER=true
        env:
          ANDROID_KEYSTORE_PATH: ../../upload-keystore.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_REQUIRE_RELEASE_SIGNING: "true"

      - name: Verify APK signer
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found in the Android SDK build-tools."
            exit 1
          fi
          SIGNER_INFO=$("$APKSIGNER" verify --verbose --print-certs "$APK")
          printf '%s\n' "$SIGNER_INFO"
          # apksigner labels certs "Signer #1 ..." when only the v1 (JAR) scheme
          # is verified, but "V2 Signer: ..." / "V3 Signer: ..." etc. when a
          # newer scheme is used instead - match either form.
          SIGNER_SHA256=$(printf '%s\n' "$SIGNER_INFO" \
            | sed -n -E 's/^(Signer #[0-9]+|V[0-9.]+ Signer:) certificate SHA-256 digest: //p' \
            | head -1)
          if [ -z "$SIGNER_SHA256" ]; then
            echo "ERROR: APK signer SHA-256 digest could not be determined."
            exit 1
          fi
          if printf '%s\n' "$SIGNER_INFO" | grep -qi 'Android Debug'; then
            echo "ERROR: Refusing to publish an APK signed with an Android Debug certificate."
            exit 1
          fi
          {
            echo "### Android APK signing"
            echo "- Signer certificate SHA-256: \`$SIGNER_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify in-app updater permission
        run: |
          set -euo pipefail
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          if ! "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-release.apk \
            | grep -q 'android.permission.REQUEST_INSTALL_PACKAGES'; then
            echo "ERROR: APK is missing REQUEST_INSTALL_PACKAGES, so sideloaded installs can't update in-app."
            exit 1
          fi

      - name: Stage artifact
        run: |
          APK="m3u-tv-v${{ needs.validate.outputs.version }}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: |
            flutter_client/m3u-tv-v${{ needs.validate.outputs.version }}-android.apk
            flutter_client/m3u-tv-v${{ needs.validate.outputs.version }}-android.apk.sha256

  # ── iOS (unsigned IPA - sideload via AltStore / TestFlight with Apple certs) ──
  #
  # To enable signed distribution add secrets and uncomment the certificate
  # install step (same pattern as the tvOS job below).
  # ─────────────────────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.desktop_artifacts_only != true }}
    runs-on: macos-latest
    needs: validate
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Set version
        run: |
          sed -i '' "s/^version: .*/version: ${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}/" pubspec.yaml

      - name: Decode Firebase config
        # GoogleService-Info.plist is gitignored (not published), so CI checkouts
        # need it written from a repo secret before the build - otherwise
        # Firebase.initializeApp() fails in release builds built from source.
        env:
          GOOGLESERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLESERVICE_INFO_PLIST_B64:-}" ]; then
            echo "ERROR: GOOGLESERVICE_INFO_PLIST_BASE64 secret is missing or empty."
            exit 1
          fi
          printf '%s' "$GOOGLESERVICE_INFO_PLIST_B64" | base64 --decode > ios/GoogleService-Info.plist
          test -s ios/GoogleService-Info.plist

      - name: Build iOS IPA (unsigned)
        run: |
          flutter build ipa --release --no-codesign

      - name: Stage artifact
        # flutter build ipa --no-codesign creates an xcarchive, not a Payload IPA.
        # The .app is inside the xcarchive; we package it manually into a Payload zip.
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: Runner.app not found at expected xcarchive path - listing build/ios/:"
            find build/ios -name "*.app" | head -10
            find build/ios -name "*.xcarchive" | head -5
            exit 1
          fi
          mkdir -p build/ios/Payload
          cp -r "$APP" build/ios/Payload/Runner.app
          (cd build/ios && zip -qr "../../m3u-tv-v${VERSION}-ios.ipa" Payload/)
          IPA="m3u-tv-v${VERSION}-ios.ipa"
          shasum -a 256 "$IPA" > "$IPA.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: |
            flutter_client/m3u-tv-v${{ needs.validate.outputs.version }}-ios.ipa
            flutter_client/m3u-tv-v${{ needs.validate.outputs.version }}-ios.ipa.sha256

  # ── Apple TV / tvOS ───────────────────────────────────────────────────────
  #
  # The tvOS Xcode project uses manual copy-phases for Flutter artifacts
  # rather than the standard Flutter backend build phase, so CI pre-builds
  # the Flutter bundle and stages it before archiving with xcodebuild.
  #
  # To enable signed/TestFlight distribution uncomment the certificate step
  # below and add these secrets:
#   APPLE_CERTIFICATE_BASE64       - p12 (base64)
#   APPLE_CERTIFICATE_PASSWORD     - p12 password
#   APPLE_PROVISIONING_PROFILE_B64 - .mobileprovision (base64)
  # ─────────────────────────────────────────────────────────────────────────
  build-tvos:
    name: Build tvOS IPA
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.desktop_artifacts_only != true }}
    runs-on: macos-latest
    needs: validate
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v7

      # Uncomment to enable signed builds (add secrets listed in the job comment above):
      # - name: Install Apple certificate & provisioning profile
      #   env:
      #     CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      #     CERT_PWD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_B64 }}
      #   run: |
      #     KC=$RUNNER_TEMP/build.keychain
      #     security create-keychain -p "" $KC
      #     security set-keychain-settings -lut 21600 $KC
      #     security unlock-keychain -p "" $KC
      #     echo "$CERT_B64" | base64 --decode -o $RUNNER_TEMP/cert.p12
      #     security import $RUNNER_TEMP/cert.p12 -P "$CERT_PWD" -A -t cert -f pkcs12 -k $KC
      #     security list-keychain -d user -s $KC
      #     PP=$RUNNER_TEMP/profile.mobileprovision
      #     echo "$PROFILE_B64" | base64 --decode -o "$PP"
      #     mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      #     cp "$PP" ~/Library/MobileDevice/Provisioning\ Profiles/

      # Shared with ci.yml: installs the pinned flutter-tvos, stages the
      # Flutter artifacts and archives the unsigned app to
      # build/Runner.xcarchive. See .github/actions/tvos-build/action.yml.
      - name: Build tvOS archive
        uses: ./.github/actions/tvos-build
        with:
          version: ${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}

      - name: Package IPA
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          APP="build/Runner.xcarchive/Products/Applications/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: Runner.app not found at expected xcarchive path - listing build/Runner.xcarchive/:"
            find build/Runner.xcarchive -maxdepth 4 || true
            exit 1
          fi
          mkdir -p build/tvos/Payload
          cp -r "$APP" build/tvos/Payload/Runner.app
          (cd build/tvos && zip -qr \
            "../../m3u-tv-v${VERSION}-tvos.ipa" Payload/)
          IPA="m3u-tv-v${VERSION}-tvos.ipa"
          shasum -a 256 "$IPA" > "$IPA.sha256"

      - name: Verify tvOS IPA contains flutter_assets
        # Regression check for issue #186: a bug in the manual "Copy
        # flutter_assets" Xcode phase let the tvOS archive succeed with no
        # Flutter assets at all. Unzip the packaged IPA (not just the
        # pre-zip .app) so this also catches any corruption introduced by
        # the packaging step itself.
        run: |
          set -euo pipefail
          IPA="m3u-tv-v${{ needs.validate.outputs.version }}-tvos.ipa"
          VERIFY_DIR="$RUNNER_TEMP/tvos-ipa-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA" -d "$VERIFY_DIR"
          ASSETS="$VERIFY_DIR/Payload/Runner.app/flutter_assets"
          if [ ! -d "$ASSETS" ]; then
            echo "ERROR: flutter_assets directory missing from packaged IPA at $ASSETS"
            exit 1
          fi
          for f in AssetManifest.bin FontManifest.json; do
            if [ ! -s "$ASSETS/$f" ]; then
              echo "ERROR: required file missing or empty in flutter_assets: $f"
              exit 1
            fi
          done
          if [ -z "$(find "$ASSETS/assets" -type f 2>/dev/null | head -1)" ]; then
            echo "ERROR: flutter_assets/assets contains no files"
            exit 1
          fi
          for f in kernel_blob.bin isolate_snapshot_data vm_snapshot_data; do
            if [ -e "$ASSETS/$f" ]; then
              echo "ERROR: JIT-only debug artifact '$f' found in a release flutter_assets - should have been excluded by the tvOS Copy flutter_assets build phase"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: tvos-ipa
          path: |
            flutter_client/m3u-tv-v${{ needs.validate.outputs.version }}-tvos.ipa
            flutter_client/m3u-tv-v${{ needs.validate.outputs.version }}-tvos.ipa.sha256

  # ── macOS ─────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS DMG
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.desktop_artifacts_only != true }}
    runs-on: macos-latest
    needs: validate
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Set version
        run: |
          sed -i '' "s/^version: .*/version: ${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}/" pubspec.yaml

      - name: Install signing certificate
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PWD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          echo "$CERT_B64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PWD" -A -t cert -f pkcs12 -k "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"

      - name: Set up App Store Connect API key
        env:
          API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_B64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Build macOS app (unsigned)
        # Sign separately after build so we control the identity and entitlements.
        env:
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: ""
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ""
        run: |
          flutter build macos --release

      - name: Sign app bundle
        # Notarization requires: Developer ID Application cert, Hardened Runtime
        # (--options runtime), and a secure timestamp (--timestamp).
        # Sign inside-out: dylibs and framework bundles first, then the .app.
        # codesign --deep is unreliable for complex bundles with many frameworks.
        run: |
          APP=$(find build/macos -name "*.app" -path "*/Release/*" | head -1)
          IDENTITY=$(security find-identity -v -p codesigning \
            | grep "Developer ID Application" \
            | grep -o '"[^"]*"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "ERROR: No 'Developer ID Application' certificate found."
            echo "Available identities:"
            security find-identity -v -p codesigning
            exit 1
          fi
          echo "Signing with: $IDENTITY"
          # Sign all dylibs
          find "$APP" -name "*.dylib" | while read f; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$f"
          done
          # Sign framework bundles inside-out (deepest paths first)
          find "$APP" -name "*.framework" | sort -r | while read fw; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$fw"
          done
          # Finally sign the .app with entitlements
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" \
            --entitlements macos/Runner/Release.entitlements \
            "$APP"
          codesign --verify --verbose "$APP"

      - name: Package as DMG
        run: |
          APP=$(find build/macos -name "*.app" -path "*/Release/*" | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found - listing build/macos/:"
            find build/macos -name "*.app" | head -10
            exit 1
          fi
          hdiutil create \
            -volname "M3U TV" \
            -srcfolder "$APP" \
            -ov -format UDZO \
            "m3u-tv-v${{ needs.validate.outputs.version }}-macos.dmg"

      - name: Notarize DMG
        run: |
          KEY=~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          RESULT=$(xcrun notarytool submit \
            "m3u-tv-v${{ needs.validate.outputs.version }}-macos.dmg" \
            --key "$KEY" \
            --key-id ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            --issuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            --wait --output-format json)
          STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization status: $STATUS - fetching Apple rejection log:"
            xcrun notarytool log "$ID" \
              --key "$KEY" \
              --key-id ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
              --issuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
            exit 1
          fi

      - name: Staple notarization ticket
        run: |
          DMG="m3u-tv-v${{ needs.validate.outputs.version }}-macos.dmg"
          xcrun stapler staple "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            flutter_client/m3u-tv-v${{ needs.validate.outputs.version }}-macos.dmg
            flutter_client/m3u-tv-v${{ needs.validate.outputs.version }}-macos.dmg.sha256

  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux packages
    # Pinned, not ubuntu-latest: the bundled GTK/glib come from the build host
    # and set the glibc floor (2.39 on 24.04). libmpv itself is the pinned
    # mpv-build prefix, not this host's package. Bump deliberately.
    runs-on: ubuntu-24.04
    needs: validate
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libwayland-dev libegl-dev \
            libsecret-1-dev libjsoncpp-dev libx11-dev libxi-dev \
            gsettings-desktop-schemas zstd imagemagick zsync desktop-file-utils \
            libmujs3 liblua5.2-0 libdisplay-info1 libva-wayland2 dconf-gsettings-backend \
            libva-drm2 libva-x11-2 libpipewire-0.3-0t64 libpulse0 \
            flatpak flatpak-builder

      - name: Install Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Set version
        run: |
          sed -i "s/^version: .*/version: ${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}/" pubspec.yaml

      # Fetches the pinned libmpv, builds, bundles and verifies the tree (every
      # ELF dependency resolves, only host-libraries.txt comes from the host,
      # bundled libmpv plays a sample), then cuts the ZIP, AppImage, .deb and
      # Flatpak from that one tree with SHA-256 sidecars.
      - name: Build and package Linux release
        env:
          UPDATE_REPO: ${{ github.repository }}
        run: |
          linux/packaging/build-linux-release.sh \
            --version "${{ needs.validate.outputs.version }}" \
            --output "$GITHUB_WORKSPACE/linux-release"

      - name: Verify installed Flatpak
        run: |
          flatpak install --user --noninteractive -y \
            "$GITHUB_WORKSPACE/linux-release/m3u-tv-v${{ needs.validate.outputs.version }}-linux-x86_64.flatpak"
          python3 linux/packaging/build-flatpak.py verify

      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            linux-release/m3u-tv-v${{ needs.validate.outputs.version }}-linux.zip
            linux-release/m3u-tv-v${{ needs.validate.outputs.version }}-linux.zip.sha256
            linux-release/m3u-tv-v${{ needs.validate.outputs.version }}-linux-x86_64.AppImage
            linux-release/m3u-tv-v${{ needs.validate.outputs.version }}-linux-x86_64.AppImage.sha256
            linux-release/m3u-tv-v${{ needs.validate.outputs.version }}-linux-x86_64.AppImage.zsync
            linux-release/m3u-tv-v${{ needs.validate.outputs.version }}-linux-x86_64.AppImage.zsync.sha256
            linux-release/m3u-tv-v${{ needs.validate.outputs.version }}-linux-amd64.deb
            linux-release/m3u-tv-v${{ needs.validate.outputs.version }}-linux-amd64.deb.sha256
            linux-release/m3u-tv-v${{ needs.validate.outputs.version }}-linux-x86_64.flatpak
            linux-release/m3u-tv-v${{ needs.validate.outputs.version }}-linux-x86_64.flatpak.sha256
          if-no-files-found: error

  # ── Windows ───────────────────────────────────────────────────────────────
  #
  # The Windows target uses a custom libmpv backend (desktop_libmpv_backend.cpp)
  # that loads its own fetched libmpv-gpu-2.dll (windows/CMakeLists.txt).
  # media_kit is not a dependency of this project -- it was removed entirely
  # after it turned out to be dead weight vendoring a second,
  # independently-versioned libmpv build that collided with this one.
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows ZIP
    runs-on: windows-latest
    needs: validate
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Set version
        run: |
          (Get-Content pubspec.yaml) `
            -replace '^version: .*', "version: ${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}" `
            | Set-Content pubspec.yaml

      - name: Build Windows app
        run: |
          flutter build windows --release

      - name: Verify Windows bundle
        run: |
          $Bundle = "build\windows\x64\runner\Release"
          $Required = @(
            "m3u_tv.exe",
            "flutter_windows.dll",
            "libmpv-gpu-2.dll",
            "libEGL.dll",
            "libGLESv2.dll",
            "d3dcompiler_47.dll",
            "zlib.dll",
            "vulkan-1.dll",
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "data\icudtl.dat",
            "data\flutter_assets\AssetManifest.bin"
          )
          foreach ($RelativePath in $Required) {
            $Path = Join-Path $Bundle $RelativePath
            if (-not (Test-Path $Path -PathType Leaf)) {
              throw "Required Windows bundle file is missing: $Path"
            }
            if ((Get-Item $Path).Length -eq 0) {
              throw "Required Windows bundle file is empty: $Path"
            }
          }

      - name: Package as ZIP
        run: |
          $V = "${{ needs.validate.outputs.version }}"
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "m3u-tv-v${V}-windows.zip"

      - name: Verify Windows archive
        run: |
          $V = "${{ needs.validate.outputs.version }}"
          $Zip = "m3u-tv-v${V}-windows.zip"
          $VerifyDir = Join-Path $env:RUNNER_TEMP "m3u-tv-windows-verify"
          Expand-Archive -Path $Zip -DestinationPath $VerifyDir
          foreach ($RelativePath in @("m3u_tv.exe", "flutter_windows.dll", "libmpv-gpu-2.dll", "libEGL.dll", "libGLESv2.dll", "vulkan-1.dll", "msvcp140.dll", "vcruntime140.dll", "data\icudtl.dat")) {
            $Path = Join-Path $VerifyDir $RelativePath
            if (-not (Test-Path $Path -PathType Leaf)) {
              throw "Required archived Windows file is missing: $RelativePath"
            }
          }
          $Hash = (Get-FileHash -Algorithm SHA256 $Zip).Hash.ToLowerInvariant()
          "$Hash  $Zip" | Set-Content "$Zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: |
            flutter_client/m3u-tv-v${{ needs.validate.outputs.version }}-windows.zip
            flutter_client/m3u-tv-v${{ needs.validate.outputs.version }}-windows.zip.sha256

      # The Microsoft Store package (MSIX) is built and submitted manually, not in
      # CI. Public releases ship the portable ZIP plus the per-user .exe installer
      # below; users who want the fully trusted, warning-free path install from
      # the Store.

      - name: Build Windows installer (.exe)
        # windows-latest ships Inno Setup preinstalled; fall back to Chocolatey if
        # ISCC is ever dropped from the image. /DAppVersion stamps the release tag
        # into the installer; /DSourceDir points ISCC at the Flutter Release bundle.
        run: |
          $V = "${{ needs.validate.outputs.version }}"
          $Iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $Iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $Iscc)) {
            $Iscc = (Get-Command ISCC.exe).Source
          }
          & $Iscc `
            "/DAppVersion=$V" `
            "/DSourceDir=$(Resolve-Path 'build\windows\x64\runner\Release')" `
            "/O$(Get-Location)" `
            "/Fm3u-tv-v${V}-windows-setup" `
            "windows\installer\m3u-tv.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Verify Windows installer
        run: |
          $V = "${{ needs.validate.outputs.version }}"
          $Setup = "m3u-tv-v${V}-windows-setup.exe"
          if (-not (Test-Path $Setup -PathType Leaf)) {
            throw "Expected installer not found: $Setup"
          }
          if ((Get-Item $Setup).Length -eq 0) {
            throw "Installer is empty: $Setup"
          }
          $Hash = (Get-FileHash -Algorithm SHA256 $Setup).Hash.ToLowerInvariant()
          "$Hash  $Setup" | Set-Content "$Setup.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            flutter_client/m3u-tv-v${{ needs.validate.outputs.version }}-windows-setup.exe
            flutter_client/m3u-tv-v${{ needs.validate.outputs.version }}-windows-setup.exe.sha256

  # ── GitHub Release ─────────────────────────────────────────────────────────
  build-web:
    name: Build Web (M3U Editor /m3u-tv)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.desktop_artifacts_only != true }}
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build and package
        run: |
          bash scripts/package-web.sh \
            "${{ needs.validate.outputs.version }}" \
            "${{ needs.validate.outputs.build_number }}"

      - uses: actions/upload-artifact@v7
        with:
          name: web-zip
          path: |
            flutter_client/build/web-release/m3u-tv-v${{ needs.validate.outputs.version }}-web.zip
            flutter_client/build/web-release/m3u-tv-v${{ needs.validate.outputs.version }}-web.zip.sha256
            flutter_client/build/web-release/m3u-tv-v${{ needs.validate.outputs.version }}-web.json
          retention-days: 7

  release:
    name: Create GitHub Release
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.desktop_artifacts_only != true }}
    runs-on: ubuntu-latest
    needs:
      - validate
      - build-android
      - build-linux
      - build-windows
      - build-web
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: artifacts/android-apks/

      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: artifacts/linux/

      - name: Download Windows ZIP
        uses: actions/download-artifact@v8
        with:
          name: windows-zip
          path: artifacts/windows-zips/

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: artifacts/windows-installer/

      - name: Download web ZIP
        uses: actions/download-artifact@v8
        with:
          name: web-zip
          path: artifacts/web/

      - name: Verify non-Apple assets
        run: |
          set -euo pipefail
          V="${{ needs.validate.outputs.version }}"
          for asset in \
            "artifacts/android-apks/m3u-tv-v${V}-android.apk" \
            "artifacts/linux/m3u-tv-v${V}-linux.zip" \
            "artifacts/linux/m3u-tv-v${V}-linux-x86_64.AppImage" \
            "artifacts/linux/m3u-tv-v${V}-linux-x86_64.AppImage.zsync" \
            "artifacts/linux/m3u-tv-v${V}-linux-amd64.deb" \
            "artifacts/linux/m3u-tv-v${V}-linux-x86_64.flatpak" \
            "artifacts/windows-zips/m3u-tv-v${V}-windows.zip" \
            "artifacts/windows-installer/m3u-tv-v${V}-windows-setup.exe" \
            "artifacts/web/m3u-tv-v${V}-web.zip"; do
            test -s "$asset"
            test -s "$asset.sha256"
            (cd "$(dirname "$asset")" && sha256sum -c "$(basename "$asset").sha256")
          done
          test -s "artifacts/web/m3u-tv-v${V}-web.json"

      - name: Generate release notes
        run: |
          set -euo pipefail
          TAG="v${{ needs.validate.outputs.version }}"
          PREV_TAG="${{ needs.validate.outputs.prev_tag }}"
          if [ -n "$PREV_TAG" ]; then
            flutter_client/scripts/generate-release-log.sh "$PREV_TAG" "$TAG" > release-notes.md
          else
            flutter_client/scripts/generate-release-log.sh "$TAG" > release-notes.md
          fi
          cat release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.validate.outputs.version }}"
          V="${{ needs.validate.outputs.version }}"
          # Version-less copy so releases/latest/download/m3u-tv-android.apk
          # is a permanent link (the Downloader code and the /tv/android docs
          # page point at it)
          cp "artifacts/android-apks/m3u-tv-v${V}-android.apk" artifacts/android-apks/m3u-tv-android.apk
          ASSETS=(
            "artifacts/android-apks/m3u-tv-v${V}-android.apk"
            "artifacts/android-apks/m3u-tv-v${V}-android.apk.sha256"
            "artifacts/android-apks/m3u-tv-android.apk"
            "artifacts/linux/m3u-tv-v${V}-linux.zip"
            "artifacts/linux/m3u-tv-v${V}-linux.zip.sha256"
            "artifacts/linux/m3u-tv-v${V}-linux-x86_64.AppImage"
            "artifacts/linux/m3u-tv-v${V}-linux-x86_64.AppImage.sha256"
            "artifacts/linux/m3u-tv-v${V}-linux-x86_64.AppImage.zsync"
            "artifacts/linux/m3u-tv-v${V}-linux-x86_64.AppImage.zsync.sha256"
            "artifacts/linux/m3u-tv-v${V}-linux-amd64.deb"
            "artifacts/linux/m3u-tv-v${V}-linux-amd64.deb.sha256"
            "artifacts/linux/m3u-tv-v${V}-linux-x86_64.flatpak"
            "artifacts/linux/m3u-tv-v${V}-linux-x86_64.flatpak.sha256"
            "artifacts/windows-zips/m3u-tv-v${V}-windows.zip"
            "artifacts/windows-zips/m3u-tv-v${V}-windows.zip.sha256"
            "artifacts/windows-installer/m3u-tv-v${V}-windows-setup.exe"
            "artifacts/windows-installer/m3u-tv-v${V}-windows-setup.exe.sha256"
            "artifacts/web/m3u-tv-v${V}-web.zip"
            "artifacts/web/m3u-tv-v${V}-web.zip.sha256"
            "artifacts/web/m3u-tv-v${V}-web.json"
          )

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" --clobber "${ASSETS[@]}"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${ASSETS[@]}"
          fi

      - name: Release summary
        run: |
          V="v${{ needs.validate.outputs.version }}"
          echo "## Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $V | **Build:** ${{ needs.validate.outputs.build_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Artifact |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Android + Android TV | \`m3u-tv-${V}-android.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux (x86_64) | \`m3u-tv-${V}-linux-x86_64.AppImage\`, \`m3u-tv-${V}-linux-amd64.deb\`, \`m3u-tv-${V}-linux-x86_64.flatpak\`, \`m3u-tv-${V}-linux.zip\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows (portable, unsigned) | \`m3u-tv-${V}-windows.zip\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows (installer, unsigned) | \`m3u-tv-${V}-windows-setup.exe\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Web (M3U Editor /m3u-tv) | \`m3u-tv-${V}-web.zip\` |" >> $GITHUB_STEP_SUMMARY

  # ── Apple Release ─────────────────────────────────────────────────────────
  release-apple:
    name: Create GitHub Release (Apple)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.desktop_artifacts_only != true }}
    runs-on: ubuntu-latest
    needs:
      - validate
      - release
      - build-ios
      - build-tvos
      - build-macos
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download iOS IPA
        uses: actions/download-artifact@v8
        with:
          name: ios-ipa
          path: artifacts/ios-ipas/

      - name: Download tvOS IPA
        uses: actions/download-artifact@v8
        with:
          name: tvos-ipa
          path: artifacts/tvos-ipas/

      - name: Download macOS DMG
        uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: artifacts/macos-dmgs/

      - name: Verify Apple assets
        run: |
          set -euo pipefail
          V="${{ needs.validate.outputs.version }}"
          for asset in \
            "artifacts/ios-ipas/m3u-tv-v${V}-ios.ipa" \
            "artifacts/tvos-ipas/m3u-tv-v${V}-tvos.ipa" \
            "artifacts/macos-dmgs/m3u-tv-v${V}-macos.dmg"; do
            test -s "$asset"
            test -s "$asset.sha256"
            (cd "$(dirname "$asset")" && sha256sum -c "$(basename "$asset").sha256")
          done

      - name: Add Apple assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.validate.outputs.version }}"
          ASSETS=(
            "artifacts/ios-ipas/m3u-tv-v${{ needs.validate.outputs.version }}-ios.ipa"
            "artifacts/tvos-ipas/m3u-tv-v${{ needs.validate.outputs.version }}-tvos.ipa"
            "artifacts/macos-dmgs/m3u-tv-v${{ needs.validate.outputs.version }}-macos.dmg"
            "artifacts/ios-ipas/m3u-tv-v${{ needs.validate.outputs.version }}-ios.ipa.sha256"
            "artifacts/tvos-ipas/m3u-tv-v${{ needs.validate.outputs.version }}-tvos.ipa.sha256"
            "artifacts/macos-dmgs/m3u-tv-v${{ needs.validate.outputs.version }}-macos.dmg.sha256"
          )

          gh release upload "$TAG" --clobber "${ASSETS[@]}"

      - name: Apple Release summary
        run: |
          V="v${{ needs.validate.outputs.version }}"
          echo "## Apple Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $V | **Build:** ${{ needs.validate.outputs.build_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Artifact |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | \`m3u-tv-${V}-ios.ipa\` |" >> $GITHUB_STEP_SUMMARY
          echo "| tvOS | \`m3u-tv-${V}-tvos.ipa\` |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | \`m3u-tv-${V}-macos.dmg\` |" >> $GITHUB_STEP_SUMMARY
