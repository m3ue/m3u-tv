			shellScript = "#!/bin/sh\n# Copy flutter_assets into the app bundle. A missing source directory means\n# the Flutter build step upstream did not produce assets - fail loudly here\n# rather than shipping an app with no flutter_assets (see issue #186: this\n# used to only warn, which let a broken CI archive succeed silently).\nFLUTTER_ASSETS_SRC=\"${PROJECT_DIR}/Flutter/flutter_assets\"\nDEST=\"${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/flutter_assets\"\nif [ ! -d \"${FLUTTER_ASSETS_SRC}\" ]; then\n  echo \"error: flutter_assets not found at ${FLUTTER_ASSETS_SRC}\"\n  exit 1\nfi\necho \"Copying flutter_assets to app bundle...\"\n# kernel_blob.bin / isolate_snapshot_data / vm_snapshot_data are JIT-only\n# artifacts the Dart VM needs for Debug (JIT) builds. Release/Profile builds\n# run the AOT code in App.framework instead and never read these - Flutter's\n# own official embed scripts likewise only stage them for Debug. This project's\n# tvos/Flutter/flutter_assets is a single shared local folder that can carry\n# stale JIT leftovers from a prior `flutter-tvos run` on a simulator, so\n# exclude them by name here rather than trusting the source folder to be clean\n# for whichever configuration is actually being built.\nif [ \"${CONFIGURATION}\" = \"Debug\" ]; then\n  RSYNC_EXCLUDES=()\nelse\n  RSYNC_EXCLUDES=(--exclude=kernel_blob.bin --exclude=isolate_snapshot_data --exclude=vm_snapshot_data)\nfi\nrsync -av --delete \"${RSYNC_EXCLUDES[@]}\" \"${FLUTTER_ASSETS_SRC}/\" \"${DEST}/\"\nif [ ! -s \"${DEST}/AssetManifest.bin\" ]; then\n  echo \"error: AssetManifest.bin missing or empty at ${DEST} after copy\"\n  exit 1\nfi\nif [ \"${CONFIGURATION}\" != \"Debug\" ] && [ -e \"${DEST}/kernel_blob.bin\" ]; then\n  echo \"error: kernel_blob.bin present in a ${CONFIGURATION} build - JIT artifact should have been excluded\"\n  exit 1\nfi\n";
