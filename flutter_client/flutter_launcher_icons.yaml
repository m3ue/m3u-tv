flutter_launcher_icons:
  # Source icon, 1024x1024 PNG generated from logo.svg by scripts/setup-icons.sh
  image_path: "assets/icons/icon.png"

  android: "launcher_icon"
  # Adaptive icon (Android 8+): dark background + centred foreground logo.
  # Keep the foreground inset at 0 so the logo fills Android's adaptive safe zone
  # instead of being double-shrunk by the generated icon XML.
  adaptive_icon_background: "#0a0a0f"
  adaptive_icon_foreground: "assets/icons/adaptive-icon.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    # Just the brand mark (logo.svg rendered straight to PNG, no composited
    # background panel) - a browser tab favicon sits on its own chrome, so
    # any added background square/squircle reads as a dark blob at 16x16
    # instead of the logo. Regenerate with:
    #   rsvg-convert -w 1024 -h 1024 assets/icons/logo.svg -o assets/icons/favicon-source.png
    image_path: "assets/icons/favicon-source.png"
    background_color: "transparent"
    theme_color: "#0a0a0f"

  macos:
    generate: true
    image_path: "assets/icons/icon.png"

  # Desktop app-icon treatment: a padded, gradient-filled squircle with
  # transparent corners (generated by scripts/setup-icons.sh), rather than
  # the full-bleed opaque square used on mobile/macOS.
  windows:
    generate: true
    image_path: "assets/icons/icon-desktop.png"
    icon_size: 256

  # Note: flutter_launcher_icons 0.14 has no Linux generator, so this block is
  # currently inert. The Linux window title is set in linux/my_application.cc
  # ("M3U TV") and the desktop-file icon resolves via APPLICATION_ID.
  linux:
    generate: true
    image_path: "assets/icons/icon-desktop.png"
