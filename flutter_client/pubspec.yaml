name: m3u_tv
description: Flutter rewrite workspace for the M3U TV client.
publish_to: 'none'

version: 1.1.2+14

environment:
  sdk: ^3.12.0

dependencies:
  cached_network_image: ^4.0.0
  clock: ^1.1.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  device_info_plus: ^13.2.0
  dpad: ^3.0.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.2
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  flutter_secure_storage_tvos:
    path: packages/flutter_secure_storage_tvos
  flutter_svg: ^2.3.0
  go_router: ^17.3.0
  intl: ^0.20.2
  palette_generator_master: ^1.1.0
  path_provider: ^2.1.0
  path_provider_tvos: ^0.0.3
  qr_flutter: ^4.1.0
  sqflite_tvos:
    path: packages/sqflite_tvos
  timezone: ^0.11.1
  url_launcher: ^6.3.0
  wakelock_plus: ^1.7.0
  wakelock_plus_tvos:
    path: packages/wakelock_plus_tvos
  web_socket_channel: ^3.0.0
  window_manager: ^0.5.1

dev_dependencies:
  build_runner: ^2.15.1
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  msix: ^3.18.0
  stream_channel: ^2.1.0
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  # Flutter hardcodes the auto-generated FlutterGeneratedPluginSwiftPackage
  # wrapper's minimum iOS version to 13.0 regardless of the project's real
  # IPHONEOS_DEPLOYMENT_TARGET (15.0), which conflicts with firebase_core /
  # firebase_messaging's own SPM manifests (15.0 minimum). Disabling SPM here
  # routes all plugins through CocoaPods instead (still fully supported via
  # their published podspecs), honoring the Podfile's real platform version.
  # This project-manifest setting is read on every flutter invocation (clean,
  # pub get, build, and Xcode's Run Script build phase alike) - unlike a shell
  # env var or the Xcode-project build setting alone, it can't be bypassed by
  # running flutter commands outside of Xcode.
  config:
    enable-swift-package-manager: false

  assets:
    - assets/icons/
    - pubspec.yaml

# Microsoft Store packaging (`dart run msix:create`).
#
# identity_name/publisher/publisher_display_name below match the app
# reservation in Partner Center - keep them in sync if the reservation
# ever changes, since the Store rejects submissions where these don't
# match exactly.
#
# store: true skips local self-signing entirely (Partner Center signs on
# ingestion) - without it the msix package silently self-signs with its own
# bundled test certificate and overwrites `publisher` with that cert's
# subject, ignoring the value below. For a local sideload-test build instead,
# comment this out (or set to false) - the resulting package won't be
# store-uploadable but installs directly on this machine.
msix_config:
  display_name: M3U TV
  publisher_display_name: sparkison
  identity_name: sparkison.M3UTV
  publisher: CN=72E1AAD5-EAA8-421E-AEFE-473CFDE56550
  msix_version: 1.1.2.0
  logo_path: assets/icons/icon.png
  capabilities: internetClient
  store: true
  languages: en-us
